[project]
name = "crowcode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=1.9.0",
    "openai>=3.20.0",
    "pyyaml>=6",
]

[project.scripts]
crowcode = "crowcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowcode"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
